<title>옷장 거울</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/*__STYLES__*/
</style>

<div id="app">
  <header class="top">
    <div class="top-in">
      <span class="brand">옷장 거울</span>
      <span class="grow"></span>
      <span class="badge" id="aiBadge">준비 중</span>
      <button class="chip-btn" id="profileBtn" type="button" aria-label="프로필 바꾸기">나</button>
    </div>
  </header>

  <main id="view" class="wrap"><p class="loading">옷장을 불러오는 중…</p></main>

  <nav class="tabs" aria-label="화면 이동">
    <div class="tabs-in">
      <a href="#mirror" data-tab="mirror">오늘</a>
      <a href="#closet" data-tab="closet">옷장</a>
      <a href="#log" data-tab="log">기록</a>
      <a href="#setup" data-tab="setup">설정</a>
    </div>
  </nav>
</div>

<div class="scrim" id="scrim" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="닫기">닫기</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="camFile" accept="image/*" capture="user" hidden>
<input type="file" id="addFile" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
