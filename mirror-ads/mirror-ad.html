<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거울광고 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--paper:#fff;--bg:#e9e9ec;--accent:#1f4e8c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px}
.bar button{border:0;background:var(--accent);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:#666;text-align:center;max-width:420px}
/* 광고판 3:5 비율 — 손그림: 사진 / 소제목 / 사진 / 소제목 */
#ad{width:min(100%,420px);aspect-ratio:3/5;background:var(--paper);border:5px solid var(--ink);display:flex;flex-direction:column}
.photo{flex:1;background:#f1f1f3 center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo .ph{font-size:clamp(28px,10vw,44px);color:#b5b5bb;font-weight:700;pointer-events:none}
.photo.has .ph{display:none}
.sub{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);text-align:center;padding:3.2% 4%;font-size:clamp(18px,6.4vw,27px);font-weight:900;letter-spacing:.04em;background:var(--paper)}
.sub:last-child{border-bottom:0}
[contenteditable]:focus{outline:2px dashed var(--accent);outline-offset:-4px}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="bar"><button onclick="save()">PNG 저장</button></div>
<p class="hint">사진 칸을 누르면 거울광고 사진으로 바꿀 수 있고, 소제목은 눌러서 고칠 수 있습니다.</p>
